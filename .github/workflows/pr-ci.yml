name: PR CI

# Merge gate for every pull request. Required check display name: "PR CI / backend"
# (stable — content may evolve in later PRs without changing branch protection).
#
# Deploy stays on main only (deploy-production.yml). Local ./scripts/run-tests-postgis.sh
# is not a substitute for this workflow.
#
# Interim smoke: Django check + migrations + health. Full apps.integrations.tests is
# still the local quality gate; wiring it here is a follow-up once Actions env matches
# docker-compose test-run (credentials / isolation). Capability-based suites = PR2.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: PR CI / backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
        shell: bash

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: stay
          POSTGRES_PASSWORD: stay
          POSTGRES_DB: stay_platform_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stay -d stay_platform_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test_postgis
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: stay_platform_test_db
      DB_USER: stay
      DB_PASSWORD: stay
      TEST_DB_NAME: stay_platform_test_db
      FCM_PUSH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        working-directory: .
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure media dir writable
        run: |
          set -euo pipefail
          mkdir -p media

      - name: Enable PostGIS extension
        run: |
          set -euo pipefail
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              host="localhost",
              port=5432,
              dbname="stay_platform_test_db",
              user="stay",
              password="stay",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS postgis;")
          print("postgis ok")
          PY

      - name: Django check
        run: |
          set -euo pipefail
          python manage.py check

      # makemigrations --check --dry-run: deferred — main currently has pending
      # model/index drift (communications, properties, integrations, reservations).

      - name: Apply migrations
        run: |
          set -euo pipefail
          python manage.py migrate --noinput

      - name: Migrate check
        run: |
          set -euo pipefail
          python manage.py migrate --check

      - name: Health smoke
        run: |
          set -euo pipefail
          python manage.py test \
            apps.api.tests.test_reception_api.ReceptionAPITests.test_health_unauthenticated \
            -v 2 --keepdb

name: Nightly

# Broader PostGIS suites for visibility. Not a required merge check (see ADR 0018).
# Failures should stay red (continue-on-error: false) so the run is obvious at 03:00 UTC.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-ci
  cancel-in-progress: false

jobs:
  backend-nightly:
    name: Nightly PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: false
    defaults:
      run:
        working-directory: backend
        shell: bash

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: stay
          POSTGRES_PASSWORD: stay
          POSTGRES_DB: stay_platform_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stay -d stay_platform_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test_postgis
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: stay_platform_test_db
      DB_USER: stay
      DB_PASSWORD: stay
      TEST_DB_NAME: stay_platform_test_db
      FCM_PUSH_ENABLED: "false"
      GUEST_CHECKIN_WEB_ONLY: "false"
      WHATSAPP_AUTOCHECKIN_MAINTENANCE: "false"
      # Meta Graph token (tests also accept legacy D360_API_KEY). Required for send_credentials_ok.
      WHATSAPP_ACCESS_TOKEN: ci-test-whatsapp-access-token
      OPS_CI_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        working-directory: .
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure media dir writable
        run: |
          set -euo pipefail
          mkdir -p media "${OPS_CI_ARTIFACT_DIR}"

      - name: Enable PostGIS extension
        run: |
          set -euo pipefail
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              host="localhost",
              port=5432,
              dbname="stay_platform_test_db",
              user="stay",
              password="stay",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS postgis;")
          print("postgis ok")
          PY

      - name: Django check
        run: |
          set -euo pipefail
          python manage.py check

      - name: Apply migrations
        run: |
          set -euo pipefail
          python manage.py migrate --noinput

      - name: Nightly PostGIS suites
        run: |
          set -euo pipefail
          mkdir -p "${OPS_CI_ARTIFACT_DIR}"
          # Broader than PR CI. Expected red until Actions parity matches local docker-run;
          # keep failing so the schedule surfaces debt (ADR 0018).
          set +e
          python manage.py test \
            apps.integrations.tests \
            apps.reservations.tests \
            apps.api.tests \
            apps.billing.tests \
            apps.tenants.tests \
            apps.properties.tests \
            -v 2 --keepdb \
            2>&1 | tee "${OPS_CI_ARTIFACT_DIR}/nightly-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "${status}"

      - name: Upload nightly test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-postgis-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: ignore
